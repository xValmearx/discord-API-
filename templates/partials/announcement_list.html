
{% for announcement in announcements %}

    <div class="announcement-card card bg-base-100 shadow-lg mb-4">
        <div class="card-body">

            <div class="flex justify-between items-center">

                <h3 class="font-bold">
                    {{ announcement.author.username }}
                </h3>

                {% if announcement.author == request.user %}

                    <form
                        hx-post="{% url 'delete_announcement' announcement.pk %}"
                        hx-target="closest .announcement-card"
                        hx-swap="outerHTML"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-error btn-sm"
                        >
                            Delete
                        </button>

                    </form>

                {% endif %}

            </div>

            <p class="text-base-content/80">
                {{ announcement.text }}
            </p>

        </div>
    </div>

{% empty %}

    <p>You do not have any announcements yet.</p>

{% endfor %}
