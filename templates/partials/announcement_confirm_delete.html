{% extends "base.html" %}

{% block content %}

<div class="card bg-base-100 shadow-xl max-w-md mx-auto mt-10">
    <div class="card-body">

        <h2 class="card-title">Delete Announcement?</h2>

        <p>
            Are you sure you want to delete this announcement?
        </p>

        <p class="font-semibold">
            {{ object.text }}
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="card-actions justify-end mt-4">

                <a href="{% url 'home' %}" class="btn btn-ghost">
                    Cancel
                </a>

                <button type="submit" class="btn btn-error">
                    Delete
                </button>

            </div>
        </form>

    </div>
</div>

{% endblock content %}
